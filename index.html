
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VÉNORA TopUp</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:24px 15px;text-align:center;
 border-bottom:1px solid #b38b36;
}
.logo{font-size:30px;font-weight:bold;color:#e9bd55}
.tag{color:#aaa;font-size:12px;letter-spacing:3px}
.hero{text-align:center;padding:45px 15px}
.hero h1{font-size:32px}
.gold{color:#e9bd55}
.hero p{color:#aaa}
.container{padding:15px;max-width:500px;margin:auto}
.card{
 background:#151515;border:1px solid #725722;
 border-radius:12px;padding:20px;margin-bottom:15px;
}
.card h3{margin:0 0 10px}
.price{font-size:24px;color:#e9bd55}
button{
 width:100%;padding:13px;background:#d6aa48;
 border:0;border-radius:7px;font-weight:bold;
 font-size:16px;cursor:pointer;
}
input{
 width:100%;padding:13px;margin:8px 0;
 background:#222;color:white;border:1px solid #555;
 border-radius:6px;
}
footer{text-align:center;color:#888;padding:30px}
</style>
</head>
<body>
<header>
 <div class="logo">👑 VÉNORA</div>
 <div class="tag">PREMIUM TOPUP STORE</div>
</header>

<section class="hero">
 <h1>WELCOME TO <span class="gold">VÉNORA</span></h1>
 <p>Your Premium Gaming Store</p>
 <p>PLAY • BUILD • WIN</p>
</section>

<div class="container">
 <h2 class="gold">Our Packages</h2>

 <div class="card">
  <h3>100 Coins</h3>
  <p class="price">Price: Coming Soon</p>
  <button onclick="choose('100 Coins')">Select Package</button>
 </div>

 <div class="card">
  <h3>300 Coins</h3>
  <p class="price">Price: Coming Soon</p>
  <button onclick="choose('300 Coins')">Select Package</button>
 </div>

 <div class="card">
  <h3>500 Coins</h3>
  <p class="price">Price: Coming Soon</p>
  <button onclick="choose('500 Coins')">Select Package</button>
 </div>

 <div class="card">
  <h2 class="gold">Contact Us</h2>
  <input id="name" placeholder="Your Name">
  <input id="contact" placeholder="Your Contact">
  <p id="selected">Selected: None</p>
  <button onclick="order()">Submit Demo Order</button>
  <p id="message"></p>
 </div>
</div>

<footer>
 VÉNORA TopUp © 2026<br>
 Premium Gaming Experience
</footer>

<script>
let selected="None";
function choose(item){
 selected=item;
 document.getElementById("selected").innerText=
 "Selected: "+item;
}
function order(){
 let n=document.getElementById("name").value;
 let c=document.getElementById("contact").value;
 if(!n||!c||selected==="None"){
 alert("Please complete all fields");
 return;
 }
 document.getElementById("message").innerText=
 "Demo order received! No payment or top-up processed.";
}
</script>
</body>
  </html>
